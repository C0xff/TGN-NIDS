# Khai báo dự án theo PEP 621. Bố cục src-layout: mã nguồn nằm trong src/tgn_nids
# nên chỉ import được sau khi cài đặt hoặc sau khi thêm src/ vào sys.path. Cách
# này ngăn việc vô tình import nhầm từ thư mục làm việc thay vì từ bản đã cài.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgn-nids"
# Dự án có HAI số phiên bản và chúng không đo cùng một thứ, nên đừng đồng bộ
# chúng với nhau.
#
#   version ở đây      : phiên bản gói phần mềm, đếm từ khi bắt đầu dự án.
#   SOURCE_VERSION     : ở `src/tgn_nids/__init__.py`, phiên bản của phương
#                        pháp thực nghiệm. Cả sáu tệp `result_*.json` đều mang
#                        giá trị này, và ô nạp mô hình của notebook phân tích
#                        dừng với lỗi khi checkpoint mang một giá trị khác.
#
# Đổi `version` không ảnh hưởng kết quả nào. Đổi `SOURCE_VERSION` làm mọi
# checkpoint đã lưu không nạp lại được, nên tuyệt đối không đổi.
version = "2.8.0"
description = "Phát hiện xâm nhập mạng bằng Temporal Graph Network kết hợp XAI, trên NF-UNSW-NB15, NF-CSE-CIC-IDS2018 và NF-ToN-IoT"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Thêm src vào sys.path khi chạy pytest, để khỏi phải cài đặt gói mỗi lần sửa
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
