# Khai báo dự án theo PEP 621, bố cục src-layout. Gói tgn_nids chỉ import được
# sau khi cài đặt hoặc khi src/ có trong sys.path.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgn-nids"
# version là phiên bản gói phần mềm. SOURCE_VERSION trong src/tgn_nids/__init__.py
# là phiên bản phương pháp thực nghiệm, được ghi vào mọi tệp result_*.json.
# Hai số độc lập với nhau. Không đổi SOURCE_VERSION, vì notebook phân tích từ
# chối nạp checkpoint mang giá trị khác.
version = "2.8.0"
description = "Phát hiện xâm nhập mạng bằng Temporal Graph Network kết hợp XAI, trên NF-UNSW-NB15, NF-CSE-CIC-IDS2018 và NF-ToN-IoT"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Cho pytest import được tgn_nids mà không cần cài gói.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
